name: Render Full Cinematic Demo

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/full-demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Generate original soundtrack
        run: npm run audio
      - name: Install rendering browser
        run: npx remotion browser ensure
      - name: Render 1080 x 1920, 60 FPS, full 24s demo
        run: |
          mkdir -p out
          npx remotion render src/video/index.ts MotionShowreel out/dynamic-motion-studio-demo-1080p.mp4 --props=video.config.json --codec=h264 --crf=20 --concurrency=2
      - name: Save downloadable full MP4
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-motion-studio-full-demo
          path: out/dynamic-motion-studio-demo-1080p.mp4
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
